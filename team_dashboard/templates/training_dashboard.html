{% extends 'base_template.html' %}

{% block title %}Wellness Dashboard{% endblock %}

{% load static %}
{% block styleSheets %}
<link rel="stylesheet" href="{% static 'team_dashboard/css/dashboard.css' %}">
<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
{% endblock %}

{% block main_content %}
    <div class="subcontainer header">
        <h1>Atleta: {{athlete.get_full_name}}</h1>
        <a class="nav" href="{% url 'training_data' %}">Datos de Entreno</a>
    </div>
    <div class='image-filter'>
        {% if avatar_url %}
            <img src="{{ avatar_url }}" alt="Avatar" width="100">
        {% else %}
            <img src="{% static 'team_dashboard/images/deafault_avatar.png'%}" alt="Default Avatar>
        {% endif %}
        <div class="filter">
            <label for="startDate">Buscar reporte:</label>
            <input type="date" id="startDate"><br>
            <button id="filterButton">Filtrar</button>
        </div>
    </div>

    <div style="display: flex; flex-direction: column;" class="subcontainer">
        <div class="chart" id="report" style="margin: 0; width: 100%; height: 1650px;"></div>
    </div>

    <script>
        // Load initial chart data
        const initialData = {{ chart_data|safe }};
        Plotly.newPlot('report', initialData.report.data, initialData.report.layout, initialData.config);

        // Function to update the chart with filtered data
        function updateChart(data) {
            console.log(data)
            Plotly.react('report', data.report.data, data.report.layout, data.config);
        }

        // Event listener for the filter button
        document.getElementById('filterButton').addEventListener('click', function() {
            const startDate = document.getElementById('startDate').value;
            // AJAX request to filter data
            fetch("{% url 'training_dashboard' user=athlete.id %}", {
                method: "POST",
                headers: {
                    "X-CSRFToken": "{{ csrf_token }}",
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({ start_date: startDate}),
            })
            .then(response => response.json())
            .then(data => updateChart(data))
            .catch(error => console.error('Error:', error));
        });
    </script>
{% endblock %}
