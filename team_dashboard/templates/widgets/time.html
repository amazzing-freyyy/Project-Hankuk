<div class="time-split-widget">
    <div class="time-labels">
        <label for="{{ widget.attrs.id }}_0" class="label-hrs">Horas</label>
        <label for="{{ widget.attrs.id }}_1" class="label-min">Minutos</label>
    </div>
    <div class="time-widgets">
        <input type="number" 
            name="{{ name }}_0" 
            class="horas"
            id="{{ widget.attrs.id }}_0" 
            placeholder=0
            min="0" max="23" />
        :
        <input type="number" 
            name="{{ name }}_1" 
            class="minutos"
            id="{{ widget.attrs.id }}_1"
            placeholder=0
            min="0" max="59" />
    </div>
</div>
