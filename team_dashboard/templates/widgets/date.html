<div class="date-widget">
    <div class="date-input">
        <button class="date-btn" type="button" onclick="setToday('id_date_btn')">Hoy</button>
        <input type="date" id="id_date_btn" name="date">
    </div>
</div>

<script>
    function setToday(name){
        const today = new Date().toISOString().split('T')[0];
        
        element = document.getElementById(name);
        if (element){
            element.value = today;
        }
    }
</script>
