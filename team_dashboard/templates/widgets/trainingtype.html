<div class="d-flex flex-column justify">
    <label for="{{ widget.attrs.id }}_training">¿Qué tipo de entreno hiciste?</label>
    <select id="{{ widget.attrs.id }}_training" name="{{ widget.name }}_training" onchange="updateSubtypes(this.value)">
        <option value="">-- Select Training Type --</option>
        {% for training, subtypes in widget.training_options.items %}
            <option value="{{ training }}" {% if widget.value.training_type == training %}selected{% endif %}>
                {{ training|capfirst }}
            </option>
        {% endfor %}
    </select>

    <input type="hidden" id="{{ widget.attrs.id }}" name="{{ widget.name }}" value="{{ widget.value.training_type }}, {{ widget.value.subtype }}">

    <div id="{{ widget.attrs.id }}_subtype_container" {% if not widget.value.subtype %}style="display:none;"{% endif %}>
        <label for="{{ widget.attrs.id }}_subtype">¿Puedes ser más específico?</label>
        <select id="{{ widget.attrs.id }}_subtype" name="{{ widget.name }}_subtype">
            {% if widget.value.training_type and widget.value.training_type in widget.training_options %}
                {% for subtype in widget.training_options|get_item:widget.value.training_type %}
                    <option value="{{ subtype }}" {% if widget.value.subtype == subtype %}selected{% endif %}>{{ subtype }}</option>
                {% endfor %}
            {% endif %}
        </select>
    </div>

<script>
const trainingOptions = {{ widget.training_options|safe }};

function updateSubtypes(trainingType) {
  const subtypeContainer = document.getElementById("{{ widget.attrs.id }}_subtype_container");
  const subtypeSelect = document.getElementById("{{ widget.attrs.id }}_subtype");
  const hiddenInput = document.getElementById("{{ widget.attrs.id }}");

  subtypeSelect.innerHTML = "";

  if (trainingType in trainingOptions) {
    subtypeContainer.style.display = "block";
    trainingOptions[trainingType].forEach(subtype => {
      const option = document.createElement("option");
      option.value = subtype.toLowerCase();
      option.textContent = subtype;
      subtypeSelect.appendChild(option);
    });
  } else {
    subtypeContainer.style.display = "none";
  }

  updateHiddenInput();
}

function updateHiddenInput() {
  const trainingType = document.getElementById("{{ widget.attrs.id }}_training").value;
  const subtype = document.getElementById("{{ widget.attrs.id }}_subtype")?.value || "";
  document.getElementById("{{ widget.attrs.id }}").value = trainingType + "|" + subtype;
}

document.getElementById("{{ widget.attrs.id }}_subtype")?.addEventListener("change", updateHiddenInput);
